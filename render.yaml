services:
  - type: web
    name: aira-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_IN_MEMORY_DB
        value: "false"
      - key: PORT
        value: "10000"
      - key: ML_SERVICE_URL
        value: http://aira-ml:10000
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PASSWORD_SALT
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: BLOCKCHAIN_PRIVATE_KEY
        sync: false
      - key: ANCHOR_CONTRACT_ADDRESS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: aira-private

  - type: web
    name: aira-ml
    runtime: python
    rootDir: ml-model
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn service.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
